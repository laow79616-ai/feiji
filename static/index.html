<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG 水军管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0b1120;color:#e2e8f0}
.card{background:#111827;border:1px solid #1f2937}
.nav-item.active{background:#2563eb;color:#fff}
.nav-item:not(.active):hover{background:#1f2937}
.group-item{cursor:pointer;border:1px solid #1f2937}
.group-item.active{border-color:#2563eb;background:#1e3a5f}
.group-item:hover{background:#1f2937}
input,textarea,select{background:#0f172a;border:1px solid #334155;color:#e2e8f0}
.btn-primary{background:#2563eb}
.btn-success{background:#059669}
.chat-me{background:#2563eb;border-radius:12px 12px 4px 12px}
.chat-other{background:#1f2937;border-radius:12px 12px 12px 4px}
</style>
</head>
<body class="min-h-screen">
<div class="border-b border-gray-800 sticky top-0 z-50 bg-[#0b1120]">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
<div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center">✈️</div>
<div><h1 class="text-lg font-bold">TG 水军管理系统</h1>
<p class="text-xs text-gray-500">左侧选线路 · 右侧操作水军</p></div>
</div></div>

<div class="max-w-6xl mx-auto px-4 py-4">
<div class="flex gap-2 mb-4 flex-wrap">
<button onclick="switchTab('accounts')" id="tab-accounts" class="nav-item active px-3 py-1.5 rounded-lg text-sm">水军管理</button>
<button onclick="switchTab('add')" id="tab-add" class="nav-item px-3 py-1.5 rounded-lg text-sm">增加水军</button>
<button onclick="switchTab('apis')" id="tab-apis" class="nav-item px-3 py-1.5 rounded-lg text-sm">API池</button>
<button onclick="switchTab('proxies')" id="tab-proxies" class="nav-item px-3 py-1.5 rounded-lg text-sm">代理池</button>
<button onclick="switchTab('targets')" id="tab-targets" class="nav-item px-3 py-1.5 rounded-lg text-sm">目标</button>
<button onclick="switchTab('join')" id="tab-join" class="nav-item px-3 py-1.5 rounded-lg text-sm">一键加入</button>
</div>

<div id="panel-accounts" class="panel">
<div class="flex gap-4" style="min-height:70vh">
  <!-- 左侧分组 -->
  <div class="w-56 shrink-0">
    <div class="card rounded-xl p-3 sticky top-20">
      <div class="flex justify-between items-center mb-3">
        <span class="font-semibold text-sm">线路分组</span>
        <button onclick="loadAccounts()" class="text-xs px-2 py-1 bg-gray-800 rounded">刷新</button>
      </div>
      <div id="groupNav" class="space-y-2 max-h-[70vh] overflow-y-auto"></div>
    </div>
  </div>
  <!-- 右侧工作区 -->
  <div class="flex-1 min-w-0">
    <div id="workArea" class="card rounded-xl p-4">
      <p class="text-gray-500 text-sm">请从左侧选择一条线路</p>
    </div>
  </div>
</div>
</div>

<div id="panel-add" class="panel hidden">
<div class="card rounded-xl p-5 mb-4">
<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
<input id="phone" placeholder="手机号" class="px-3 py-2 rounded">
<input id="name" placeholder="备注" class="px-3 py-2 rounded">
<select id="selectApi" class="px-3 py-2 rounded"></select>
<select id="selectProxy" class="px-3 py-2 rounded"></select>
</div>
<button onclick="addAccount()" class="btn-primary px-5 py-2 rounded">发送验证码</button>
<p id="addMsg" class="mt-2 text-sm text-green-400"></p>
</div>
<div class="card rounded-xl p-5">
<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
<input id="verifyPhone" placeholder="手机号" class="px-3 py-2 rounded">
<input id="code" placeholder="验证码" class="px-3 py-2 rounded">
<input id="password" placeholder="两步密码" class="px-3 py-2 rounded">
</div>
<button onclick="verifyCode()" class="btn-success px-5 py-2 rounded">确认登录</button>
<p id="verifyMsg" class="mt-2 text-sm text-green-400"></p>
</div>
</div>

<div id="panel-apis" class="panel hidden">
<div class="card rounded-xl p-5 mb-4">
<textarea id="apiBatchText" rows="4" class="w-full px-3 py-2 rounded text-sm mb-3"></textarea>
<button onclick="batchAddApis()" class="btn-primary px-5 py-2 rounded">批量添加</button>
<p id="apiMsg" class="mt-2 text-sm text-green-400"></p>
</div>
<div class="card rounded-xl p-5"><div id="apiList" class="space-y-2 text-sm"></div></div>
</div>

<div id="panel-proxies" class="panel hidden">
<div class="card rounded-xl p-5 mb-4">
<textarea id="proxyBatchText" rows="4" class="w-full px-3 py-2 rounded text-sm mb-3"></textarea>
<button onclick="batchAddProxies()" class="btn-primary px-5 py-2 rounded">批量添加</button>
<p id="proxyMsg" class="mt-2 text-sm text-green-400"></p>
</div>
<div class="card rounded-xl p-5"><div id="proxyList" class="space-y-2 text-sm"></div></div>
</div>

<div id="panel-targets" class="panel hidden">
<div class="card rounded-xl p-5 mb-4">
<div class="flex gap-3 mb-3">
<input id="targetName" placeholder="备注" class="px-3 py-2 rounded flex-1">
<input id="targetLink" placeholder="链接" class="px-3 py-2 rounded flex-[2]">
</div>
<button onclick="addTarget()" class="btn-primary px-5 py-2 rounded">添加</button>
<p id="targetMsg" class="mt-2 text-sm text-green-400"></p>
</div>
<div class="card rounded-xl p-5"><div id="targetList" class="space-y-2 text-sm"></div></div>
</div>

<div id="panel-join" class="panel hidden">
<div class="card rounded-xl p-5">
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
<select id="joinAccounts" multiple class="h-36 px-2 py-1 rounded text-sm"></select>
<select id="joinTargets" multiple class="h-36 px-2 py-1 rounded text-sm"></select>
</div>
<button onclick="doJoin()" class="btn-primary px-6 py-2 rounded">一键加入</button>
<pre id="joinResult" class="mt-4 text-xs bg-black/30 p-3 rounded max-h-48 overflow-auto"></pre>
</div>
</div>
</div>

<script>
let allGroups={}, currentGroup=null, currentSession=null, currentChatId=null, allDialogs=[];

function switchTab(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.remove('hidden');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='accounts')loadAccounts();
  if(name==='apis')loadApis();
  if(name==='proxies')loadProxies();
  if(name==='targets'||name==='join'){loadTargets();loadAccounts();}
  if(name==='add'){loadApis();loadProxies();}
}

async function loadAccounts(){
  const [accRes,proxyRes]=await Promise.all([fetch('/accounts/'),fetch('/pools/proxies')]);
  const accounts=await accRes.json();
  const proxies=await proxyRes.json();
  allGroups={};
  accounts.forEach(a=>{
    const k=a.proxy_name||'未分配';
    if(!allGroups[k])allGroups[k]=[];
    allGroups[k].push(a);
  });
  proxies.forEach(p=>{if(!allGroups[p.name])allGroups[p.name]=[];});

  const keys=Object.keys(allGroups);
  const nav=document.getElementById('groupNav');
  nav.innerHTML=keys.map((name,i)=>{
    const list=allGroups[name];
    const online=list.filter(a=>a.is_online).length;
    const active=currentGroup===name?'active':'';
    return `<div class="group-item rounded-lg px-3 py-2 ${active}" onclick="selectGroup('${name.replace(/'/g,"\\'")}')">
      <div class="text-sm font-medium truncate">${i+1}组 · ${name}</div>
      <div class="text-xs text-gray-400">${list.length}/10 · 在线${online}</div>
    </div>`;
  }).join('')||'<p class="text-gray-500 text-sm">暂无线路</p>';

  if(currentGroup && allGroups[currentGroup]) selectGroup(currentGroup);
  else if(keys.length) selectGroup(keys[0]);
  else document.getElementById('workArea').innerHTML='<p class="text-gray-500 text-sm">暂无数据</p>';

  const opts=accounts.map(a=>`<option value="${a.session_name}">${a.name||a.phone}</option>`).join('');
  const je=document.getElementById('joinAccounts');
  if(je)je.innerHTML=opts;
}

function selectGroup(name){
  currentGroup=name;
  document.querySelectorAll('.group-item').forEach(el=>el.classList.remove('active'));
  // 重新高亮（简单方式：再渲染导航状态）
  const list=allGroups[name]||[];
  const online=list.filter(a=>a.is_online).length;
  const remain=Math.max(0,10-list.length);

  let html=`<div class="flex justify-between items-center mb-4 flex-wrap gap-2">
    <div>
      <h3 class="font-semibold">${name}</h3>
      <p class="text-xs text-gray-400">${list.length}/10 · 在线${online} · 剩余${remain}</p>
    </div>
    <div class="flex gap-2">
      <button onclick="lineOnline('${name.replace(/'/g,"\\'")}')" class="text-sm px-3 py-1.5 bg-green-700 rounded">整组上线</button>
      <button onclick="lineOffline('${name.replace(/'/g,"\\'")}')" class="text-sm px-3 py-1.5 bg-gray-600 rounded">整组下线</button>
    </div>
  </div>
  <div class="space-y-2">`;

  if(!list.length) html+='<p class="text-gray-500 text-sm">该线路暂无水军号</p>';
  else list.forEach(a=>{
    html+=`<div class="bg-[#0f172a] rounded-lg overflow-hidden">
      <div class="px-3 py-2 flex items-center justify-between gap-2">
        <div>
          <div class="text-sm">${a.name||a.phone}</div>
          <div class="text-xs ${a.is_online?'text-green-400':'text-red-400'}">${a.is_online?'在线':'离线'}</div>
        </div>
        <div class="flex gap-2">
          <button onclick="toggleChat('${a.session_name}','${(a.name||a.phone).replace(/'/g,'')}')" class="text-sm px-3 py-1 bg-blue-700 rounded">聊天</button>
          <button onclick="deleteAccount(${a.id})" class="text-sm px-3 py-1 bg-red-800 rounded">删除</button>
        </div>
      </div>
      <div id="chatbox-${a.session_name}" class="hidden border-t border-gray-700 p-3">
        <div class="flex gap-2 mb-2">
          <input id="search-${a.session_name}" placeholder="搜索对话" class="flex-1 px-2 py-1 rounded text-sm" oninput="filterDialogs('${a.session_name}')">
          <button onclick="closeChatBox('${a.session_name}')" class="text-xs px-2 py-1 bg-gray-700 rounded">关闭</button>
        </div>
        <div id="dialogs-${a.session_name}" class="max-h-40 overflow-y-auto text-sm mb-2 space-y-1"></div>
        <div id="msgs-${a.session_name}" class="max-h-52 overflow-y-auto text-sm mb-2 space-y-1 hidden"></div>
        <div id="sendbox-${a.session_name}" class="hidden flex gap-2">
          <input id="input-${a.session_name}" class="flex-1 px-2 py-1 rounded text-sm" placeholder="输入消息" onkeydown="if(event.key==='Enter')sendMsg('${a.session_name}')">
          <button onclick="sendMsg('${a.session_name}')" class="btn-primary px-3 py-1 rounded text-sm">发送</button>
        </div>
      </div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('workArea').innerHTML=html;

  // 更新左侧高亮
  document.querySelectorAll('.group-item').forEach(el=>{
    if(el.textContent.includes(name.split('·').pop().trim()) || el.innerHTML.includes(name)) el.classList.add('active');
  });
}

async function toggleChat(session,name){
  const box=document.getElementById('chatbox-'+session);
  document.querySelectorAll('[id^=chatbox-]').forEach(el=>{if(el.id!=='chatbox-'+session)el.classList.add('hidden');});
  if(!box.classList.contains('hidden')){box.classList.add('hidden');return;}
  box.classList.remove('hidden');
  currentSession=session;
  document.getElementById('dialogs-'+session).innerHTML='加载中...';
  document.getElementById('msgs-'+session).classList.add('hidden');
  document.getElementById('sendbox-'+session).classList.add('hidden');
  try{await fetch('/accounts/'+session+'/reconnect',{method:'POST'});}catch(e){}
  const res=await fetch('/chat/dialogs/'+session);
  const data=await res.json();
  if(data.detail){document.getElementById('dialogs-'+session).innerHTML='<p class="text-red-400">'+data.detail+'</p>';return;}
  allDialogs=data.dialogs||[];
  renderDialogs(session,allDialogs);
}

function renderDialogs(session,list){
  const box=document.getElementById('dialogs-'+session);
  if(!list.length){box.innerHTML='<p class="text-gray-500">暂无对话</p>';return;}
  box.innerHTML=list.map(d=>`<div class="cursor-pointer hover:bg-[#1e293b] rounded px-2 py-1.5" onclick="openMsg('${session}',${d.id})">
    <div class="font-medium truncate">${d.name}</div>
    <div class="text-xs text-gray-500">${d.is_group||d.is_channel?'群组':'私聊'}${d.unread?' ·'+d.unread:''}</div>
  </div>`).join('');
}
function filterDialogs(session){
  const kw=(document.getElementById('search-'+session).value||'').toLowerCase();
  renderDialogs(session,kw?allDialogs.filter(d=>d.name.toLowerCase().includes(kw)):allDialogs);
}
async function openMsg(session,chatId){
  currentChatId=chatId;
  const mbox=document.getElementById('msgs-'+session);
  const sbox=document.getElementById('sendbox-'+session);
  mbox.classList.remove('hidden');sbox.classList.remove('hidden');
  mbox.innerHTML='加载中...';
  const res=await fetch('/chat/messages/'+session+'/'+chatId);
  const data=await res.json();
  if(data.detail){mbox.innerHTML='<p class="text-red-400">'+data.detail+'</p>';return;}
  if(!data.messages||!data.messages.length){mbox.innerHTML='<p class="text-gray-500">暂无消息</p>';return;}
  mbox.innerHTML=data.messages.map(m=>`<div class="flex ${m.out?'justify-end':'justify-start'}"><div class="max-w-[85%] px-2 py-1 text-sm ${m.out?'chat-me':'chat-other'}">${m.text||'[媒体]'}</div></div>`).join('');
  mbox.scrollTop=mbox.scrollHeight;
}
async function sendMsg(session){
  const text=document.getElementById('input-'+session).value.trim();
  if(!text||!currentChatId)return;
  const res=await fetch('/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_name:session,chat_id:currentChatId,text})});
  if(res.ok){document.getElementById('input-'+session).value='';openMsg(session,currentChatId);}
  else alert((await res.json()).detail||'失败');
}
function closeChatBox(session){document.getElementById('chatbox-'+session).classList.add('hidden');}

async function lineOnline(name){
  if(!confirm('上线整组?'))return;
  const res=await fetch('/accounts/line/online?proxy_name='+encodeURIComponent(name),{method:'POST'});
  const d=await res.json();
  alert('成功'+(d.success||[]).length+' 失败'+(d.failed||[]).length);
  loadAccounts();
}
async function lineOffline(name){
  if(!confirm('下线整组?'))return;
  const res=await fetch('/accounts/line/offline?proxy_name='+encodeURIComponent(name),{method:'POST'});
  alert((await res.json()).msg||'已下线');
  loadAccounts();
}
async function deleteAccount(id){
  if(!confirm('确定删除?'))return;
  if((await fetch('/accounts/'+id,{method:'DELETE'})).ok)loadAccounts();
}

async function addAccount(){
  const phone=document.getElementById('phone').value.trim();
  const name=document.getElementById('name').value.trim();
  const api_id=parseInt(document.getElementById('selectApi').value);
  const proxy_id=parseInt(document.getElementById('selectProxy').value);
  if(!phone||!api_id||!proxy_id)return alert('请填写完整');
  const res=await fetch('/accounts/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,name,api_id,proxy_id})});
  const d=await res.json();
  document.getElementById('addMsg').textContent=res.ok?'验证码已发送':(d.detail||JSON.stringify(d));
  if(res.ok)document.getElementById('verifyPhone').value=phone;
}
async function verifyCode(){
  const phone=document.getElementById('verifyPhone').value.trim();
  const code=document.getElementById('code').value.trim();
  const password=document.getElementById('password').value.trim()||null;
  const res=await fetch('/accounts/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,code,password})});
  const d=await res.json();
  document.getElementById('verifyMsg').textContent=res.ok?'登录成功':(d.detail||JSON.stringify(d));
  if(res.ok)loadAccounts();
}
async function loadApis(){
  const list=await(await fetch('/pools/apis')).json();
  document.getElementById('apiList').innerHTML=list.map(a=>`<div class="bg-[#0f172a] rounded px-3 py-2">${a.name} · 剩${a.remain}</div>`).join('')||'<p class="text-gray-500">暂无</p>';
  const sel=document.getElementById('selectApi');
  if(sel)sel.innerHTML=list.filter(a=>a.remain>0).map(a=>`<option value="${a.id}">${a.name}（剩${a.remain}）</option>`).join('');
}
async function batchAddApis(){
  const text=document.getElementById('apiBatchText').value.trim();
  if(!text)return;
  const d=await(await fetch('/pools/apis/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();
  document.getElementById('apiMsg').textContent=`成功${d.success} 失败${d.failed_count}`;
  loadApis();
}
async function loadProxies(){
  const list=await(await fetch('/pools/proxies')).json();
  document.getElementById('proxyList').innerHTML=list.map(p=>`<div class="bg-[#0f172a] rounded px-3 py-2">${p.name} · 剩${p.remain}</div>`).join('')||'<p class="text-gray-500">暂无</p>';
  const sel=document.getElementById('selectProxy');
  if(sel)sel.innerHTML=list.filter(p=>p.remain>0).map(p=>`<option value="${p.id}">${p.name}（剩${p.remain}）</option>`).join('');
}
async function batchAddProxies(){
  const text=document.getElementById('proxyBatchText').value.trim();
  if(!text)return;
  const d=await(await fetch('/pools/proxies/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();
  document.getElementById('proxyMsg').textContent=`成功${d.success} 失败${d.failed_count}`;
  loadProxies();
}
async function addTarget(){
  const name=document.getElementById('targetName').value.trim();
  const link=document.getElementById('targetLink').value.trim();
  if(!name||!link)return;
  await fetch('/targets/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,link})});
  document.getElementById('targetMsg').textContent='已添加';loadTargets();
}
async function loadTargets(){
  const list=await(await fetch('/targets/')).json();
  document.getElementById('targetList').innerHTML=list.map(t=>`<div class="bg-[#0f172a] rounded px-3 py-2">${t.name}<div class="text-xs text-gray-500">${t.link}</div></div>`).join('')||'<p class="text-gray-500">暂无</p>';
  const sel=document.getElementById('joinTargets');
  if(sel)sel.innerHTML=list.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
}
async function doJoin(){
  const accounts=[...document.getElementById('joinAccounts').selectedOptions].map(o=>o.value);
  const targetIds=[...document.getElementById('joinTargets').selectedOptions].map(o=>parseInt(o.value));
  if(!accounts.length||!targetIds.length)return alert('请选择');
  const d=await(await fetch('/targets/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_names:accounts,target_ids:targetIds})})).json();
  document.getElementById('joinResult').textContent=JSON.stringify(d,null,2);
}
loadAccounts();
</script>
</body>
</html>
