<script src="https://cdn.tailwindcss.com">
function proxySelectAll(on){
  document.querySelectorAll('.proxy-ck').forEach(c=>c.checked=!!on);
}
function selectedProxyIds(){
  return [...document.querySelectorAll('.proxy-ck:checked')].map(c=>parseInt(c.value)).filter(Boolean);
}
async function deleteProxy(id, name){
  if(!confirm('删除代理【'+(name||id)+'】？有号的线路不会删')) return;
  const r=await fetch('/pools/proxies/'+id,{method:'DELETE'});
  let d={}; try{d=await r.json()}catch(e){return alert('失败')}
  if(!r.ok) return alert(d.detail||JSON.stringify(d));
  if(typeof loadProxies==='function') loadProxies();
}
async function deleteSelectedProxies(){
  const ids=selectedProxyIds();
  if(!ids.length) return alert('先勾选');
  if(!confirm('删除选中 '+ids.length+' 条？有号的会跳过')) return;
  const r=await fetch('/pools/proxies/delete-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  const d=await r.json();
  alert((d.msg||'')+'\n跳过: '+(d.skipped||[]).join('\n'));
  if(typeof loadProxies==='function') loadProxies();
}
async function deleteAllProxies(){
  if(!confirm('清空全部代理IP？水军号会留在库里，稍后可一键重新分配')) return;
  const r=await fetch('/pools/proxies/clear-all',{method:'POST'});
  let d={}; try{d=await r.json()}catch(e){return alert('失败')}
  alert(d.msg||JSON.stringify(d));
  if(typeof loadProxies==='function') loadProxies();
  if(typeof loadAccounts==='function') loadAccounts();
}


function apiSelectAll(on){
  document.querySelectorAll('.api-ck').forEach(c=>c.checked=!!on);
}
function selectedApiIds(){
  return [...document.querySelectorAll('.api-ck:checked')].map(c=>parseInt(c.value)).filter(Boolean);
}
async function deleteApi(id){
  if(!confirm('删除该 API？水军号会留在库里')) return;
  const r=await fetch('/pools/apis/'+id,{method:'DELETE'});
  let d={}; try{d=await r.json()}catch(e){return alert('失败')}
  if(!r.ok) return alert(d.detail||JSON.stringify(d));
  if(typeof loadApis==='function') loadApis();
}
async function deleteSelectedApis(){
  const ids=selectedApiIds();
  if(!ids.length) return alert('先勾选');
  if(!confirm('删除选中 '+ids.length+' 条 API？号留在库')) return;
  const r=await fetch('/pools/apis/delete-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  const d=await r.json();
  alert(d.msg||JSON.stringify(d));
  if(typeof loadApis==='function') loadApis();
}
async function deleteAllApis(){
  if(!confirm('清空全部 API？水军号留在库，稍后重新分配')) return;
  const r=await fetch('/pools/apis/clear-all',{method:'POST'});
  let d={}; try{d=await r.json()}catch(e){return alert('失败')}
  alert(d.msg||JSON.stringify(d));
  if(typeof loadApis==='function') loadApis();
  if(typeof loadAccounts==='function') loadAccounts();
}


async function rebalanceAccounts(){
  if(!confirm('把库里全部水军号均匀分配到当前代理（有API也一起均匀分）？')) return;
  const r=await fetch('/accounts/rebalance',{method:'POST'});
  let d={}; try{d=await r.json()}catch(e){return alert('请求失败')}
  alert(d.msg||JSON.stringify(d));
  if(typeof loadProxies==='function') loadProxies();
  if(typeof loadApis==='function') loadApis();
  if(typeof loadAccounts==='function') loadAccounts();
}

<script>

function updateAccTotal(list){
  const arr = Array.isArray(list) ? list : (window.allAccounts||window.accounts||[]);
  const el = document.getElementById('accTotalCount');
  if(el) el.textContent = '· 共 ' + arr.length + ' 个';
}
const _fetch = window.fetch;
window.fetch = async function(){
  const res = await _fetch.apply(this, arguments);
  try{
    const url = String(arguments[0]||'');
    if(url.indexOf('/accounts/')>=0 && (!url.split('?')[0].replace(/\/+$/,'').split('/').pop() || url==='/accounts/' || url.endsWith('/accounts') || /\/accounts\/?\?/.test(url) || url==='/accounts/' || url.indexOf('/accounts/?')>=0 || url==='/accounts')){
      const clone = res.clone();
      clone.json().then(d=>{
        const list = Array.isArray(d) ? d : (d.accounts||d.items||d.data||[]);
        if(Array.isArray(list) && list.length>=0 && (list[0]?.phone || list[0]?.session_name || list.length===0)){
          window.allAccounts = list;
          updateAccTotal(list);
        }
      }).catch(()=>{});
    }
  }catch(e){}
  return res;
};

let allGroups={}, currentGroup=null, currentSession=null, currentChatId=null, allDialogs=[];


async function checkHealthGroup(proxyName){
  try{
    let accs=[];
    if(typeof allGroups!=='undefined' && allGroups[proxyName]) accs=allGroups[proxyName];
    else if(typeof allAccounts!=='undefined') accs=allAccounts.filter(a=>(a.proxy_name||a.proxy||'')===proxyName);
    const names=accs.map(a=>a.session_name).filter(Boolean);
    if(!names.length) return alert('该组无账号：'+proxyName);
    if(!confirm('检测线路【'+proxyName+'】共 '+names.length+' 个号？')) return;
    const res=await fetch('/accounts/check-health',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_names:names})
    });
    const text=await res.text();
    let d; try{ d=JSON.parse(text); }catch(e){ return alert('请重新登录'); }
    alert('活跃 '+(d.active||0)+' / 死号 '+(d.dead||0)+' / 失败 '+(d.failed||0)+' / 共 '+(d.total||names.length));
    if(typeof loadAccounts==='function') loadAccounts();
  }catch(e){ alert('检测失败 '+e); }
}


async function checkAllHealth(){
  if(!confirm('后台检测全部水军？测完自动标记死号，请勿同时整组上线')) return;
  const r=await fetch('/accounts/check-all/start',{method:'POST'});
  const d=await r.json();
  if(!d.job_id) return alert(JSON.stringify(d));
  alert('已开始后台检测 job='+d.job_id+' 共 '+(d.total||''));
  const poll=async()=>{
    const s=await(await fetch('/accounts/check-all/status/'+d.job_id)).json();
    const el=document.getElementById('checkAllMsg');
    if(el) el.textContent='检测 '+(s.done||0)+'/'+(s.total||0)+' 活'+(s.alive||0)+' 死'+(s.dead||0);
    if(s.status==='running'||s.status==='pending') setTimeout(poll,3000);
    else {
      alert('检测完成 活 '+(s.alive||0)+' 死 '+(s.dead||0)+' 失败 '+(s.failed||0));
      if(typeof loadAccounts==='function') loadAccounts();
    }
  };
  poll();
}


function filterLines(){
  const q=(document.getElementById('lineSearch')?.value||'').trim().toLowerCase();
  document.querySelectorAll('[data-line],[data-proxy],.line-item,#lineList > *,#groupList > *').forEach(el=>{
    const t=(el.innerText||el.textContent||'').toLowerCase();
    el.style.display = (!q || t.includes(q)) ? '' : 'none';
  });
}


function filterAccounts(){
  const q=(document.getElementById('accSearch')||{}).value||'';
  const s=q.trim().toLowerCase().replace(/\s+/g,'');
  document.querySelectorAll('[data-group],[data-phone],.group-item,.acc-row').forEach(el=>{
    const t=((el.dataset.phone||el.dataset.group||el.textContent)||'').toLowerCase().replace(/\s+/g,'');
    el.style.display = (!s || t.indexOf(s)>=0) ? '' : 'none';
  });
}


function searchAccount(){
  const el=document.getElementById('accSearch');
  const q=((el&&el.value)||'').trim().toLowerCase().replace(/[\s+]/g,'');
  if(!q){ if(currentGroup) selectGroup(currentGroup); return; }
  if(typeof allGroups!=='object' || !allGroups) return;
  let foundGroup=null, found=null;
  for(const [g, arr] of Object.entries(allGroups)){
    for(const a of (arr||[])){
      const phone=String(a.phone||'').toLowerCase().replace(/[\s+]/g,'');
      const name=String(a.name||'').toLowerCase();
      const sess=String(a.session_name||'').toLowerCase();
      if(phone.indexOf(q)>=0 || name.indexOf(q)>=0 || sess.indexOf(q)>=0){
        foundGroup=g; found=a; break;
      }
    }
    if(found) break;
  }
  if(!foundGroup){ alert('未找到'); return; }
  currentGroup=foundGroup;
  if(typeof selectGroup==='function') selectGroup(foundGroup);
  setTimeout(()=>{
    document.querySelectorAll('#panel-accounts [data-phone], #panel-accounts div').forEach(div=>{
      const t=(div.innerText||'');
      if(!/\+\d{6,}/.test(t)) return;
      const hit=t.toLowerCase().replace(/[\s+]/g,'').indexOf(q)>=0;
      div.style.outline = hit ? '2px solid #22c55e' : '';
    });
  }, 50);
}






if(!window.__chatSearchHook){
  window.__chatSearchHook=true;
  document.addEventListener('input', function(e){
    const inp=e.target;
    if(!inp || inp.tagName!=='INPUT') return;
    const box=inp.closest('[id^="chatbox-"]');
    if(!box) return;
    const session=box.id.replace('chatbox-','');
    if(typeof filterDialogs==='function') filterDialogs(session);
  });
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    const inp=e.target;
    if(!inp || inp.tagName!=='INPUT') return;
    const box=inp.closest('[id^="chatbox-"]');
    if(!box) return;
    e.preventDefault();
    const session=box.id.replace('chatbox-','');
    if(typeof searchChatUser==='function') searchChatUser(session);
  });
}


function _chatListEl(session){
  const box=document.getElementById('chatbox-'+session);
  if(!box) return null;
  return document.getElementById('dialogs-'+session)
      || box.querySelector('#dialogs-'+session)
      || box.querySelector('[id^="dialogs"]')
      || box.querySelector('.overflow-auto');
}
function filterDialogs(session){
  const box=document.getElementById('chatbox-'+session);
  if(!box) return;
  const inp=box.querySelector('input');
  let q=((inp&&inp.value)||'').trim().toLowerCase();
  q=q.replace(/^https?:\/\//,'').replace(/^t\.me\//,'').replace(/^@/,'');
  const list=_chatListEl(session);
  if(!list) return;
  const kids=list.children;
  let shown=0;
  for(let i=0;i<kids.length;i++){
    const el=kids[i];
    if(el.id==='resolve-row') continue;
    const t=(el.textContent||'').toLowerCase();
    const ok=!q || t.indexOf(q)>=0;
    el.style.display=ok?'':'none';
    if(ok) shown++;
  }
}
async function searchChatUser(session){
  const box=document.getElementById('chatbox-'+session);
  if(!box){ alert('没有聊天框'); return; }
  const inp=box.querySelector('input');
  const q=(inp&&inp.value||'').trim();
  if(!q){ filterDialogs(session); return; }
  filterDialogs(session);
  const list=_chatListEl(session);
  let row=document.getElementById('resolve-row');
  if(row) row.remove();
  row=document.createElement('div');
  row.id='resolve-row';
  row.className='px-2 py-1 text-xs text-yellow-300';
  row.textContent='正在查找 '+q+' ...';
  if(list) list.insertBefore(row, list.firstChild);
  try{
    const res=await fetch('/chat/resolve?session_name='+encodeURIComponent(session)+'&q='+encodeURIComponent(q));
    const d=await res.json();
    if(!d.ok){
      row.className='px-2 py-1 text-xs text-red-400';
      row.textContent='未找到: '+(d.msg||res.status);
      return;
    }
    row.className='px-2 py-1 text-sm bg-white/10 cursor-pointer';
    row.innerHTML='找到：'+(d.name||q)+' <span class="text-xs text-gray-400">@'+(d.username||'')+'</span>';
    row.onclick=function(){
      if(typeof openChat==='function') openChat(session, d.id, d.name||q);
      else if(typeof loadMessages==='function') loadMessages(session, d.id);
    };
    
    currentSession=session; currentChatId=d.id;
    if(typeof openChat==='function'){ try{ openChat(session, d.id, d.name||q); }catch(e){ console.log(e); } }
    if(typeof loadMessages==='function'){ try{ loadMessages(session, d.id); }catch(e){ console.log(e); } }
    if(typeof loadMsgs==='function'){ try{ loadMsgs(session, d.id); }catch(e){ console.log(e); } }
    const msgs=document.getElementById('msgs-'+session);
    const sbox=document.getElementById('sendbox-'+session);
    if(msgs) msgs.classList.remove('hidden');
    if(sbox) sbox.classList.remove('hidden');

  }catch(e){
    row.className='px-2 py-1 text-xs text-red-400';
    row.textContent='请求失败 '+e;
  }
}

async function loadAccounts(){
  
  const BAD_PROXY_IPS = ['168.143.238.250','198.104.201.254','204.1.105.195','192.220.250.125','198.87.100.109','165.254.210.237','204.1.123.22','204.1.104.254','198.65.17.19','198.87.101.173'];
  window.proxyOkMap = window.proxyOkMap || {};

  try{
    const ps = await (await fetch('/pools/proxies')).json();
    window.proxyOkMap = {};
    (ps||[]).forEach(x=>{
      const ip=(x.proxy_str||x.name||'').split(':')[0].replace('代理-','');
      const bad = BAD_PROXY_IPS.some(b=> (x.name||'').includes(b) || (x.proxy_str||'').includes(b) || ip===b);
      window.proxyOkMap[x.name] = !bad && (x.is_ok!==0 && x.is_ok!==false && x.is_ok!=='0');
    });
  }catch(e){}

  const [accRes,proxyRes]=await Promise.all([fetch('/accounts/'),fetch('/pools/proxies')]);
  const accounts=await accRes.json();
  const proxies=await proxyRes.json();
  allGroups={};
  accounts.forEach(a=>{
    const k=a.proxy_name||'未分配';
    if(!allGroups[k])allGroups[k]=[];
    allGroups[k].push(a);
  });
  proxies.forEach(p=>{if(!allGroups[p.name])allGroups[p.name]=[];});

  const keys=Object.keys(allGroups);
  const nav=document.getElementById('groupNav');
  nav.innerHTML=keys.map((name,i)=>{
    const list=allGroups[name];
    const online=list.filter(a=>a.is_online).length;
    const active=currentGroup===name?'active':'';
    return `<div class="group-item rounded-lg px-3 py-2 ${active}" onclick="selectGroup('${name.replace(/'/g,"\\'")}')">
      <div class="text-sm font-medium whitespace-nowrap overflow-visible ${ (window.proxyOkMap||{})[name]===false ? 'text-red-400' : 'text-green-400' }">${i+1}组 · ${name}</div>
      <div class="text-xs text-gray-400">${list.length}/15 · 在线${online} · 死号${list.filter(a=>a.health_status==='dead').length} ·冻结${list.filter(a=>a.health_status==='frozen').length}</div>
    </div>`;
  }).join('')||'<p class="text-gray-500 text-sm">暂无线路</p>';

  if(currentGroup && allGroups[currentGroup]) selectGroup(currentGroup);
  else if(keys.length) selectGroup(keys[0]);
  else document.getElementById('workArea').innerHTML='<p class="text-gray-500 text-sm">暂无数据</p>';

  const opts=accounts.map(a=>`<option value="${a.session_name}">${a.phone||a.name}</option>`).join('');
  const je=document.getElementById('joinAccounts');
  if(je){je.innerHTML=opts;} if(typeof updateJoinCounts==='function') updateJoinCounts();
}

          <button onclick="openProfile('${a.session_name}','${(a.phone||a.name).replace(/'/g,'')}')" class="text-sm px-3 py-1 bg-gray-700 rounded">资料</button>
<label class="inline-flex items-center"><input type="checkbox" class="acc-chk mr-2" style="width:22px;height:22px;transform:scale(1.35);transform-origin:center" data-id="${a.id}"></label><button onclick="deleteAccount(${a.id})" class="text-sm px-3 py-1 bg-red-800 rounded">删除</button>
        </div>
      </div>
      <div id="chatbox-${a.session_name}" class="hidden border-t border-gray-700 p-3">
        <div class="flex gap-2 mb-2">
          <input id="search-${a.session_name}" placeholder="搜索对话" class="flex-1 px-2 py-1 rounded text-sm" oninput="filterDialogs('${a.session_name}')" onkeydown="if(event.key==='Enter'){event.preventDefault();searchChatUser('${a.session_name}');}">
          <button onclick="closeChatBox('${a.session_name}')" class="text-xs px-2 py-1 bg-gray-700 rounded">关闭</button>

async function toggleChat(session,name){
  const box=document.getElementById('chatbox-'+session);
  document.querySelectorAll('[id^=chatbox-]').forEach(el=>{if(el.id!=='chatbox-'+session)el.classList.add('hidden');});
  if(!box.classList.contains('hidden')){box.classList.add('hidden');return;}
  box.classList.remove('hidden');
  currentSession=session;
  document.getElementById('dialogs-'+session).innerHTML='加载中...';
  document.getElementById('msgs-'+session).classList.add('hidden');
  document.getElementById('sendbox-'+session).classList.add('hidden');
  try{await fetch('/accounts/'+session+'/reconnect',{method:'POST'});}catch(e){}
  const res=await fetch('/chat/dialogs/'+session);
  const data=await res.json();
  if(data.detail){document.getElementById('dialogs-'+session).innerHTML='<p class="text-red-400">'+data.detail+'</p>';return;}
  allDialogs=data.dialogs||[];
  renderDialogs(session,allDialogs);
}

function renderDialogs(session,list){
  const box=document.getElementById('dialogs-'+session);
  if(!list.length){box.innerHTML='<p class="text-gray-500">暂无对话</p>';return;}
  box.innerHTML=list.map(d=>`<div class="cursor-pointer hover:bg-[#1e293b] rounded px-2 py-1.5" onclick="openMsg('${session}',${d.id})">
    <div class="font-medium truncate">${d.name}</div>
    <div class="text-xs text-gray-500">${d.is_group||d.is_channel?'群组':'私聊'}${d.unread?' ·'+d.unread:''}</div>
  </div>`).join('');
}
async function openMsg(session,chatId){
  currentChatId=chatId;
  const mbox=document.getElementById('msgs-'+session);
  const sbox=document.getElementById('sendbox-'+session);
  mbox.classList.remove('hidden');sbox.classList.remove('hidden');
  mbox.innerHTML='加载中...';
  const res=await fetch('/chat/messages/'+session+'/'+chatId);
  const data=await res.json();
  if(data.detail){mbox.innerHTML='<p class="text-red-400">'+data.detail+'</p>';return;}
  if(!data.messages||!data.messages.length){mbox.innerHTML='<p class="text-gray-500">暂无消息</p>';return;}
  mbox.innerHTML=data.messages.map(m=>{
    const t=m.date?new Date(m.date).toLocaleString():'';
    const body=m.text||(m.media_type?'['+m.media_type+']':'[媒体]');
    return `<div class="flex ${m.out?'justify-end':'justify-start'}">
      <div class="max-w-[85%] px-2 py-1 text-sm ${m.out?'chat-me':'chat-other'}">
        <div>${body}</div>
        <div class="text-[10px] text-gray-500 mt-0.5">${t}</div>
      </div>
    </div>`;
  }).join('');
  mbox.scrollTop=mbox.scrollHeight;
}
async function sendMsg(session){
  const text=document.getElementById('input-'+session).value.trim();
  if(!text||!currentChatId)return;
  const res=await fetch('/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_name:session,chat_id:currentChatId,text})});
  if(res.ok){document.getElementById('input-'+session).value='';openMsg(session,currentChatId);}
  else alert((await res.json()).detail||'失败');
}

async function loadLibrary() {
  const box = document.getElementById("pfLibrary");
  box.innerHTML = "加载中...";
  try {
    const d = await (await fetch("/chat/library")).json();
    const files = d.files || [];
    if (!files.length) {
      box.innerHTML = '<span style="font-size:12px;color:#64748b">图库为空，请先上传</span>';
      return;
    }
    box.innerHTML = files.map(f =>
      `<img src="${f.url}" data-name="${f.name}" onclick="setPhotoFromLibrary('${f.name}')"
        style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent"
        onmouseover="this.style.borderColor='#2563eb'" onmouseout="this.style.borderColor='transparent'">`
    ).join("");
  } catch(e) {
    box.innerHTML = '<span style="color:#f87171">加载失败</span>';
  }
}

async function uploadToLibrary() {
  const files = document.getElementById("pfUpload").files;
  if (!files || !files.length) return;
  document.getElementById("pfMsg").textContent = "上传中 0/" + files.length;
  let ok = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    const form = new FormData();
    form.append("file", files[i]);
    try {
      const res = await fetch("/chat/library/upload", { method: "POST", body: form });
      const d = await res.json();
      if (d.ok) ok++; else fail++;
    } catch(e) { fail++; }
    document.getElementById("pfMsg").textContent = "上传中 " + (i+1) + "/" + files.length;
  }
  document.getElementById("pfMsg").textContent = "完成：成功 " + ok + " 失败 " + fail;
  document.getElementById("pfUpload").value = "";
  loadLibrary();
}

async function batchAddProxies(){
  const text=document.getElementById('proxyBatchText').value.trim();
  if(!text)return;
  const d=await(await fetch('/pools/proxies/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();
  document.getElementById('proxyMsg').textContent=`成功${d.success} 失败${d.failed_count}`;
  loadProxies();
}
async function addTarget(){
  const name=document.getElementById('targetName').value.trim();
  const link=document.getElementById('targetLink').value.trim();
  if(!name||!link)return;
  await fetch('/targets/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,link})});
  document.getElementById('targetMsg').textContent='已添加';loadTargets();
}

async function deleteTarget(id){
  if(!confirm('删除该目标？不会让水军退群，只删面板记录')) return;
  const r=await fetch('/targets/'+id,{method:'DELETE'});
  if(!r.ok){alert(await r.text());return;}
  loadTargets();
}

async function loadTargets(){
  try{
    const list=await(await fetch('/targets/')).json();
    if(!Array.isArray(list)){
      document.getElementById('targetList').innerHTML='<p class="text-red-400">加载失败</p>';
      return;
    }
    document.getElementById('targetList').innerHTML=list.map(t=>`
      <div class="bg-[#0f172a] rounded px-3 py-2 flex justify-between items-center gap-2">
        <div>
          <div class="text-sm">${t.name}${t.member_count!=null?' <span class="text-green-400 text-xs">'+t.member_count+'人</span>':''}</div>
          <div class="text-xs text-gray-500">${t.link}</div>
        </div>
        <button onclick="refreshMembers(${t.id})" class="text-xs px-2 py-1 bg-gray-700 rounded shrink-0">刷新人数</button><button onclick="deleteTarget(${t.id})" class="text-xs px-2 py-1 bg-red-800 rounded ml-1">删除</button>
      </div>
    `).join('')||'<p class="text-gray-500">暂无</p>';
    const sel=document.getElementById('joinTargets');
    if(sel){
      sel.innerHTML=list.map(t=>`<option value="${t.id}">${t.name}${t.member_count!=null?' · '+t.member_count+'人':''}</option>`).join('');
      if(typeof updateJoinCounts==='function') updateJoinCounts();
    }
  }catch(e){
    document.getElementById('targetList').innerHTML='<p class="text-red-400">加载失败</p>';
  }
}

async function refreshMembers(id){
  try{
    const m=await(await fetch('/targets/'+id+'/members')).json();
    if(m.members!=null) alert('当前人数: '+m.members);
    else alert(m.msg||'查询失败');
    loadTargets();
  }catch(e){ alert('查询失败'); }
}

async function doLeave(){
  const accounts=[...document.getElementById('joinAccounts').selectedOptions].map(o=>o.value);
  const targetIds=[...document.getElementById('joinTargets').selectedOptions].map(o=>parseInt(o.value));
  const interval=parseInt(document.getElementById('joinInterval')?.value||5);
  if(!accounts.length||!targetIds.length)return alert('请选择水军和目标');
  if(!confirm('确定让选中水军退出选中的群/频道？'))return;
  const statusEl=document.getElementById('joinStatus');
  if(statusEl) statusEl.innerHTML='<span class="text-yellow-400">退出中...</span>';
  try{
    const d=await(await fetch('/targets/leave',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_names:accounts.filter(s=>!window.allAccounts||(window.allAccounts.find(a=>a.session_name===s)||{}).is_online),target_ids:targetIds,interval:Math.min(interval,10)})
    })).json();
    document.getElementById('joinResult').textContent=JSON.stringify(d,null,2);
    if(statusEl && d.details){
      statusEl.innerHTML=d.details.map(r=>{
        const ok=r.success;
        return '<div class="'+(ok?'text-green-400':'text-red-400')+'">'+(ok?'✓':'✗')+' '+r.account+' → '+(r.msg||'')+'</div>';
      }).join('');
    }
  }catch(e){
    if(statusEl) statusEl.innerHTML='<span class="text-red-400">请求失败</span>';
    document.getElementById('joinResult').textContent=String(e);
  }
}

let currentJoinJob = null;
let joinPollTimer = null;


function updateJoinCounts(){
  const acc=document.getElementById('joinAccounts');
  const tgt=document.getElementById('joinTargets');
  if(acc){
    document.getElementById('joinAccCount').textContent=acc.options.length;
    document.getElementById('joinAccSelected').textContent=acc.selectedOptions.length;
  }
  if(tgt){
    document.getElementById('joinTargetCount').textContent=tgt.options.length;
    document.getElementById('joinTargetSelected').textContent=tgt.selectedOptions.length;
  }
}


async function setMonitor(session){
  if(!confirm('将此号设为监听号（用于查询群人数，会保持连接）？')) return;
  const res=await fetch('/accounts/'+session+'/set_monitor?enable=true',{method:'POST'});
  const d=await res.json();
  alert(d.msg||JSON.stringify(d));
  loadAccounts();
}


async function importZip(){
  const f=document.getElementById('zipFile').files[0];
  if(!f) return alert('请选择 ZIP');
  const fd=new FormData();
  fd.append('file', f);
  const apiEl=document.getElementById('selectApi');
  const proxyEl=document.getElementById('selectProxy');
  if(apiEl && apiEl.value) fd.append('api_id', apiEl.value);
  if(proxyEl && proxyEl.value) fd.append('proxy_id', proxyEl.value);
  const box=document.getElementById('zipResult');
  if(box) box.textContent='上传中...';
  try{
    const startRes=await fetch('/accounts/import-zip/start',{method:'POST',body:fd});
    const text=await startRes.text();
    let d;
    try{ d=JSON.parse(text); }catch(e){
      if(box) box.textContent='返回不是JSON，请重新登录后再试';
      return;
    }
    if(!d.job_id){ if(box) box.textContent=JSON.stringify(d,null,2); return; }
    if(box) box.textContent='后台导入中 job='+d.job_id;
    const poll=async()=>{
      const s=await(await fetch('/accounts/import-zip/status/'+d.job_id)).json();
      let t='状态:'+(s.status||'')+'\n成功 '+(s.success||0)+' / 死号 '+(s.dead||0)+' / 失败 '+(s.failed||0)+'\n'+(s.msg||'');
      if(s.details&&s.details.length) t += '\n' + s.details.slice(-20).join(' | ');
      if(box) box.textContent=t;
      if(s.status==='running'||s.status==='pending') setTimeout(poll,3000);
      else if(typeof loadAccounts==='function') loadAccounts();
    };
    poll();
  }catch(e){ if(box) box.textContent=String(e); }
}



function toggleJoinAccounts(){
  const sel=document.getElementById('joinAccounts');
  if(!sel) return;
  for(const o of sel.options) o.selected = true;
  if(typeof updateJoinCounts==='function') updateJoinCounts();
}
function clearJoinAccounts(){
  const sel=document.getElementById('joinAccounts');
  if(!sel) return;
  for(const o of sel.options) o.selected = false;
  if(typeof updateJoinCounts==='function') updateJoinCounts();
}

async function doJoin(){
  const accEl=document.getElementById('joinAccounts');
  const tgtEl=document.getElementById('joinTargets');
  const intEl=document.getElementById('joinInterval');
  if(!accEl||!tgtEl){ alert('找不到选择框'); return; }
  const session_names=[...accEl.selectedOptions].map(o=>o.value).filter(Boolean);
  const target_ids=[...tgtEl.selectedOptions].map(o=>parseInt(o.value)).filter(n=>n);
  const interval=parseInt((intEl&&intEl.value)||180);
  if(!session_names.length){ alert('请选择水军'); return; }
  if(!target_ids.length){ alert('请选择目标'); return; }
  if(!confirm('开始加入 '+session_names.length+' 个号到 '+target_ids.length+' 个目标，间隔 '+interval+' 秒？')) return;
  const box=document.getElementById('joinStatus')||document.getElementById('joinResult');
  try{
    const res=await fetch('/targets/join/start',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_names, target_ids, interval})
    });
    const text=await res.text();
    let d; try{ d=JSON.parse(text); }catch(e){ alert('请重新登录'); return; }
    if(box) box.textContent=JSON.stringify(d,null,2);
    if(d.job_id){ currentJoinJob=d.job_id; if(typeof startJoinPoll==='function') startJoinPoll(d.job_id); }
    else alert(d.msg||JSON.stringify(d));
  }catch(e){ alert('启动失败 '+e); }
}

function startJoinPoll(){
  if(joinPollTimer) clearInterval(joinPollTimer);
  joinPollTimer=setInterval(pollJoinJob, 3000);
  pollJoinJob();
}

async function pollJoinJob(){
  if(!currentJoinJob) return;
  try{
    const j=await(await fetch('/targets/join/status/'+currentJoinJob)).json();
    const box=document.getElementById('joinStatus')||document.getElementById('joinResult');
    const done=j.done||0, total=j.total||0, ok=j.success||0, fail=j.failed||0;
    if(box) box.textContent='状态:'+j.status+' · 进度 '+done+'/'+total+' · 成功'+ok+' 失败'+fail+' · '+(j.current||'');
    const list=document.getElementById('joinLiveList');
    if(list){
      const details=j.details||[];
      const waiting=Math.max(0, total-details.length);
      let html='<div class="text-xs text-gray-400 mb-2">等待 '+waiting+' · 已处理 '+details.length+'</div>';
      html += details.slice().reverse().slice(0,80).map(d=>{
        const msg=(d.msg||d.message||'').toString();
        let st='等待', color='text-gray-400';
        if(d.success===true || msg.indexOf('加入成功')>=0){ st='已加入'; color='text-green-400'; }
        if(msg.indexOf('已经是成员')>=0 || msg.indexOf('已在')>=0 || msg.indexOf('ALREADY')>=0){ st='已在群'; color='text-blue-400'; }
        if(d.success===false){ st='失败'; color='text-red-400'; }
        const name=d.session_name||d.phone||d.account||'';
        return '<div class="flex justify-between px-2 py-1 bg-[#0f172a] rounded"><span>'+name+'</span><span class="'+color+'">'+st+'</span></div>';
      }).join('');
      list.innerHTML=html;
    }
  }catch(e){}
}

async function stopJoinJob(){
  if(!currentJoinJob) return;
  await fetch('/targets/join/stop/'+currentJoinJob,{method:'POST'});
  alert('已请求停止');
}
loadAccounts();

function proxySelectAll(on){
  document.querySelectorAll('.proxy-ck').forEach(c=>c.checked=!!on);
}
function selectedProxyIds(){
  return [...document.querySelectorAll('.proxy-ck:checked')].map(c=>parseInt(c.value)).filter(Boolean);
}
async function deleteProxy(id, name){
  if(!confirm('删除代理【'+(name||id)+'】？有号的线路不会删')) return;
  const r=await fetch('/pools/proxies/'+id,{method:'DELETE'});
  let d={}; try{d=await r.json()}catch(e){return alert('失败')}
  if(!r.ok) return alert(d.detail||JSON.stringify(d));
  if(typeof loadProxies==='function') loadProxies();
}
async function deleteSelectedProxies(){
  const ids=selectedProxyIds();
  if(!ids.length) return alert('先勾选');
  if(!confirm('删除选中 '+ids.length+' 条？有号的会跳过')) return;
  const r=await fetch('/pools/proxies/delete-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  const d=await r.json();
  alert((d.msg||'')+'\n跳过: '+(d.skipped||[]).join('\n'));
  if(typeof loadProxies==='function') loadProxies();
}
async function deleteAllProxies(){
  const ids=[...document.querySelectorAll('.proxy-ck')].map(c=>parseInt(c.value)).filter(Boolean);
  if(!ids.length) return alert('没有代理');
  if(!confirm('全部删除 '+ids.length+' 条？有号的线路会跳过')) return;
  const r=await fetch('/pools/proxies/delete-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});
  const d=await r.json();
  alert((d.msg||'')+'\n跳过: '+(d.skipped||[]).join('\n'));
  if(typeof loadProxies==='function') loadProxies();
}
